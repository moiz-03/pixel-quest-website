<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <style>
    .bg { fill: #0B0F1A; } .card { fill: #131A33; stroke: #25324F; }
    .ink { fill: #FFFFFF; } .muted { fill: #8FA3BF; } .dim { fill: #5C6E8C; }
    .mint { fill: #00E5A0; } .gold { fill: #FFC542; }
    .t { font-family: ui-monospace, monospace; }
    .pt { font-family: ui-monospace, monospace; letter-spacing: 1px; }
  </style>
  <rect class="bg" width="360" height="780"/>
  <!-- centered celebration -->
  <text class="pt gold" x="180" y="220" font-size="14" text-anchor="middle">LEVEL UP</text>
  <text class="pt ink" x="180" y="290" font-size="40" text-anchor="middle">5</text>
  <text class="pt mint" x="180" y="330" font-size="14" text-anchor="middle">SQUIRE</text>
  <text class="t muted" x="180" y="366" font-size="12" text-anchor="middle">Your training begins.</text>
  <!-- divider -->
  <line x1="60" y1="410" x2="300" y2="410" stroke="#25324F"/>
  <!-- reward rows -->
  <text class="pt dim" x="40" y="450" font-size="10">UNLOCKED</text>
  <rect class="card" x="40" y="464" width="280" height="56" rx="10"/>
  <text class="t ink" x="60" y="498" font-size="13">Streak freeze slot 2</text>
  <text class="t gold" x="300" y="498" font-size="11" text-anchor="end">SHOP</text>
  <rect class="card" x="40" y="532" width="280" height="56" rx="10"/>
  <text class="t ink" x="60" y="566" font-size="13">New quest reminder</text>
  <text class="t gold" x="300" y="566" font-size="11" text-anchor="end">SET</text>
  <!-- footer -->
  <text class="pt dim" x="180" y="700" font-size="10" text-anchor="middle">NEXT: 6 · 550 XP TO GO</text>
</svg>