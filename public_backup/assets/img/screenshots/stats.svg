<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" width="360" height="780">
  <style>
    .bg { fill: #0B0F1A; } .card { fill: #131A33; stroke: #25324F; }
    .ink { fill: #FFFFFF; } .muted { fill: #8FA3BF; } .dim { fill: #5C6E8C; }
    .mint { fill: #00E5A0; } .gold { fill: #FFC542; }
    .t { font-family: ui-monospace, monospace; }
    .pt { font-family: ui-monospace, monospace; letter-spacing: 1px; }
  </style>
  <rect class="bg" width="360" height="780"/>
  
  <text class="pt ink" x="20" y="46" font-size="12">YOUR STATS</text>
  <text class="t dim" x="20" y="66" font-size="10">ALL-TIME</text>
  
  <rect class="card" x="20" y="92" width="155" height="120" rx="10"/>
  <text class="pt dim" x="36" y="122" font-size="9">STREAK</text>
  <text class="pt mint" x="36" y="168" font-size="24">12</text>
  <text class="t dim" x="36" y="192" font-size="10">days</text>

  <rect class="card" x="185" y="92" width="155" height="120" rx="10"/>
  <text class="pt dim" x="201" y="122" font-size="9">TOTAL XP</text>
  <text class="pt gold" x="201" y="168" font-size="24">1,250</text>
  <text class="t dim" x="201" y="192" font-size="10">earned</text>

  <rect class="card" x="20" y="228" width="155" height="120" rx="10"/>
  <text class="pt dim" x="36" y="258" font-size="9">QUESTS DONE</text>
  <text class="pt ink" x="36" y="304" font-size="24">87</text>
  <text class="t dim" x="36" y="328" font-size="10">all-time</text>

  <rect class="card" x="185" y="228" width="155" height="120" rx="10"/>
  <text class="pt dim" x="201" y="258" font-size="9">BEST STREAK</text>
  <text class="pt ink" x="201" y="304" font-size="24">21</text>
  <text class="t dim" x="201" y="328" font-size="10">days</text>

  <text class="pt dim" x="20" y="392" font-size="10">BY CATEGORY</text>
  <rect class="card" x="20" y="406" width="320" height="220" rx="10"/>
  
  <rect x="40" y="428" width="12" height="12" rx="2" fill="#3AA0FF"/>
  <text class="t ink" x="64" y="440" font-size="12">Health</text>
  <rect x="40" y="452" width="240" height="8" rx="2" fill="#1E2A45"/>
  <rect x="40" y="452" width="180" height="8" rx="2" fill="#3AA0FF"/>
  
  <rect x="40" y="486" width="12" height="12" rx="2" fill="#FF4D8F"/>
  <text class="t ink" x="64" y="498" font-size="12">Fitness</text>
  <rect x="40" y="510" width="240" height="8" rx="2" fill="#1E2A45"/>
  <rect x="40" y="510" width="120" height="8" rx="2" fill="#FF4D8F"/>
  
  <rect x="40" y="544" width="12" height="12" rx="2" fill="#9D6BFF"/>
  <text class="t ink" x="64" y="556" font-size="12">Skills</text>
  <rect x="40" y="568" width="240" height="8" rx="2" fill="#1E2A45"/>
  <rect x="40" y="568" width="72" height="8" rx="2" fill="#9D6BFF"/>
  
  <rect x="40" y="602" width="12" height="12" rx="2" fill="#FF4D8F"/>
  <text class="t ink" x="64" y="614" font-size="12">Self-improvement</text>
  <rect x="40" y="626" width="240" height="8" rx="2" fill="#1E2A45"/>
  <rect x="40" y="626" width="96" height="8" rx="2" fill="#FF4D8F"/>
</svg>